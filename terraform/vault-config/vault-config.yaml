# Declarative source of truth for Vault's own configuration - secrets engine
# mounts, and one entry per app under `apps` grouping its policy and
# auth/secrets-engine role bindings together. Add a new mount or app here;
# main.tf/auth.tf/dynamic-secrets.tf only need changes for a genuinely new
# *kind* of resource these for_each blocks don't already cover. An app only
# needs the sub-keys it actually uses - aws_auth/aws_secret are optional.
#
# aws_auth and aws_secret hold only the generic, non-sensitive shape (which
# policies, which TTLs) - which AWS IAM principal each one binds to is
# deliberately kept out of this file and defined explicitly next to the IAM
# resources themselves (auth.tf / demo-client.tf), so a real trust
# relationship is never hidden behind a YAML value.

mounts:
  secret:
    type: kv
    description: "Static secrets (KV v2) - see guide/04-configuration.md"
    options:
      version: "2"

apps:
  inventory-service:
    policy_file: inventory-service.hcl

    aws_auth:
      token_policies:
        - inventory-service

    aws_secret:
      default_sts_ttl: 900
      max_sts_ttl: 3600
