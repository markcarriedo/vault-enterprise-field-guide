default_install_hook_types:
  - pre-commit
  - post-commit

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: update-changelog
        name: Regenerate CHANGELOG.md
        entry: scripts/update-changelog.sh
        language: script
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        verbose: true
