repos:
  - repo: local
    hooks:
      - id: update-changelog
        name: Regenerate CHANGELOG.md
        entry: scripts/update-changelog.sh
        language: script
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        verbose: true

  # Runs after update-changelog (hook order = listed order) so gitleaks also
  # scans the freshly regenerated CHANGELOG.md before the commit is allowed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
