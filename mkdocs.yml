site_name: Vault Enterprise on AWS EC2 — Field Guide
site_description: A working field guide documenting the install and configuration of HashiCorp Vault Enterprise on AWS EC2.
site_url: https://markcarriedo.github.io/vault-enterprise-field-guide/
repo_name: vault-enterprise-field-guide
repo_url: https://github.com/markcarriedo/vault-enterprise-field-guide
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/vault-logo.svg
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/vault-brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

nav:
  - Home: index.md
  - Guide:
      - Overview: guide/index.md
      - 1. Planning & Prerequisites: guide/01-planning.md
      - 2. AWS Infrastructure: guide/02-aws-infrastructure.md
      - 3. Installing Vault Enterprise: guide/03-installation.md
      - 4. Configuration:
          - Overview: guide/04-configuration/index.md
          - Static secrets (KV v2): guide/04-configuration/01-static-secrets.md
          - AWS auth method: guide/04-configuration/02-aws-auth.md
          - Dynamic secrets (AWS secrets engine): guide/04-configuration/03-dynamic-aws-secrets.md
          - Audit logging (CloudWatch): guide/04-configuration/04-audit-logging.md
          - Raft snapshot storage: guide/04-configuration/05-raft-snapshots.md
          - Raft Autopilot: guide/04-configuration/06-raft-autopilot.md
          - Transit (encryption as a service): guide/04-configuration/07-transit.md
          - PKI (Vault as a certificate authority): guide/04-configuration/08-pki.md
          - Database secrets engine: guide/04-configuration/09-database-secrets.md
      - 5. Troubleshooting: guide/05-troubleshooting.md
  - Runbooks:
      - Overview: runbooks/index.md
      - Connect to the cluster manually: runbooks/connect-manually.md
      - Test dynamic AWS secrets: runbooks/dynamic-aws-secrets.md
      - Verify audit logging: runbooks/audit-logging.md
      - Backup and restore a Raft snapshot: runbooks/raft-snapshot-backup-restore.md
      - Regenerate the root token: runbooks/root-token-regeneration.md
      - Recover from a lost Vault node: runbooks/node-replacement.md
      - Test Transit encryption: runbooks/transit-encryption.md
      - Test PKI certificate issuance: runbooks/pki-certificates.md
      - Test dynamic database credentials: runbooks/database-credentials.md
  - Reference:
      - reference/architecture.md
      - reference/patterns.md
      - reference/decisions.md
      - reference/glossary.md
  - Journal: journal/index.md
